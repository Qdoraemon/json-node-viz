[package]
name = "json-viz-backend"
version = "0.1.0"
edition = "2021"
description = "JsonViz backend — auth, cloud storage, plan gating, Lemon Squeezy webhooks"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.10", features = ["cookie-private"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Auth & crypto
argon2 = "0.5"
rand = "0.8"
time = "0.3"

# Lemon Squeezy webhook verification
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# IDs
uuid = { version = "1", features = ["v4", "serde"] }

# Dates
chrono = { version = "0.4", features = ["serde"] }

# Config & env
dotenvy = "0.15"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "2"
anyhow = "1"
